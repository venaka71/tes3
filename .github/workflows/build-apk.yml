name: Build & Release Auto Mancing APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compile Debug APK
        run: gradle assembleDebug

      - name: Rename APK for Easy Download
        run: cp app/build/outputs/apk/debug/app-debug.apk AutoMancing-Overlay-v2.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoMancing-Overlay-v2-APK
          path: AutoMancing-Overlay-v2.apk

      - name: Publish APK directly to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "Auto Mancing Overlay APK v2.0 (Build #${{ github.run_number }})"
          body: "Unduh file **AutoMancing-Overlay-v2.apk** di bawah ini langsung ke HP Android Anda."
          files: AutoMancing-Overlay-v2.apk
