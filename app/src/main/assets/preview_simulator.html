<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Simulasi Latihan Mancing</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  body {
    margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(180deg, #38bdf8 0%, #0284c7 45%, #0369a1 100%);
    position: relative;
  }
  .hud-info {
    position: absolute; top: 10px; right: 12px;
    background: rgba(15,23,42,0.75); color: #f8fafc;
    padding: 6px 12px; border-radius: 10px; font-size: 11px;
    border: 1px solid rgba(56,189,248,0.4);
  }
  #castBarWrap {
    position: absolute; bottom: 175px; right: 36px;
    width: 116px; height: 15px; background: rgba(0,0,0,0.55);
    border: 2px solid #fff; border-radius: 10px; overflow: hidden; display: none;
  }
  #castFill {
    width: 0%; height: 100%;
    background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
  }
  #reelGameWrap {
    position: absolute; top: 20%; left: 58%;
    width: 44px; height: 240px;
    background: #3B6E7C;
    border: 4px solid #F8FAFC; border-radius: 14px;
    display: none; overflow: hidden;
  }
  #catchZone {
    position: absolute; left: 3px; width: 30px; height: 64px;
    background: #8CE063; border: 2px solid #eab308;
    border-radius: 10px; bottom: 20px;
  }
  #fishIcon {
    position: absolute; left: 7px; width: 22px; height: 18px;
    background: #1C262B; border-radius: 50% 50% 40% 40%;
    bottom: 110px;
  }
  #progressWrap {
    position: absolute; top: 20%; left: calc(58% + 48px);
    width: 12px; height: 240px; background: rgba(0,0,0,0.5);
    border-radius: 6px; overflow: hidden; display: none;
    border: 2px solid #fff;
  }
  #progressFill {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 30%;
    background: #eab308;
  }
  #actionBtn {
    position: absolute; bottom: 32px; right: 32px;
    width: 118px; height: 118px; border-radius: 50%;
    background: #1B75BC; border: 5px solid #e0f2fe;
    color: #fff; font-weight: 800; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }
  #catchPopup {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 240px; height: 185px; background: #FDFBF7;
    border-radius: 16px; border: 4px solid #cbd5e1;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    color: #1e293b; font-weight: bold; box-shadow: 0 12px 30px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
  <div class="hud-info">Layar Tes Simulasi (Atau langsung buka Game Memancing Anda)</div>
  <div id="castBarWrap"><div id="castFill"></div></div>

  <div id="reelGameWrap">
    <div id="catchZone"></div>
    <div id="fishIcon"></div>
  </div>
  <div id="progressWrap"><div id="progressFill"></div></div>

  <div id="catchPopup" onclick="closePopup()">
    <div style="font-size:28px;">🦐</div>
    <div style="margin-top:6px;">Udang 17 gr</div>
    <div style="font-size:11px; color:#64748b; margin-top:8px;">Ketuk untuk menutup</div>
  </div>

  <div id="actionBtn">Mancing</div>

<script>
  let state = "MANCING";
  let holding = false;
  let castProgress = 0;
  let barPos = 20;
  let fishPos = 110;
  let fishVel = 2.0;
  let reelProgress = 35;
  let waitTimer = null;

  const btn = document.getElementById('actionBtn');
  const castWrap = document.getElementById('castBarWrap');
  const castFill = document.getElementById('castFill');
  const reelWrap = document.getElementById('reelGameWrap');
  const progWrap = document.getElementById('progressWrap');
  const catchZone = document.getElementById('catchZone');
  const fishIcon = document.getElementById('fishIcon');
  const progFill = document.getElementById('progressFill');
  const popup = document.getElementById('catchPopup');

  function setButtonVisual(label, bgHex) {
    btn.innerText = label;
    btn.style.background = bgHex;
  }

  function onDown(e) {
    e.preventDefault();
    holding = true;
    if (state === "MANCING") {
      state = "LEPAS";
      castProgress = 0;
      castWrap.style.display = "block";
      setButtonVisual("Lepas!", "#E8832A");
    } else if (state === "LEPAS") {
      startWaitingForFish();
    } else if (state === "STRIKE") {
      startReelMinigame();
    } else if (state === "POPUP") {
      closePopup();
    }
  }

  function onUp(e) {
    e.preventDefault();
    holding = false;
    if (state === "LEPAS" && castProgress > 12) {
      startWaitingForFish();
    }
  }

  btn.addEventListener('mousedown', onDown);
  btn.addEventListener('mouseup', onUp);
  btn.addEventListener('touchstart', onDown, {passive: false});
  btn.addEventListener('touchend', onUp, {passive: false});

  function startWaitingForFish() {
    castWrap.style.display = "none";
    state = "ANGKAT";
    setButtonVisual("Angkat", "#21445B");
    clearTimeout(waitTimer);
    waitTimer = setTimeout(() => {
      if (state === "ANGKAT") {
        state = "STRIKE";
        setButtonVisual("Strike!", "#E65127");
      }
    }, 1800);
  }

  function startReelMinigame() {
    state = "TARIK";
    setButtonVisual("Tarik", "#58A52C");
    reelWrap.style.display = "block";
    progWrap.style.display = "block";
    barPos = 30;
    fishPos = 105;
    reelProgress = 40;
  }

  function closePopup() {
    popup.style.display = "none";
    state = "MANCING";
    setButtonVisual("Mancing", "#1B75BC");
  }

  setInterval(() => {
    if (state === "LEPAS") {
      castProgress += 5;
      if (castProgress >= 100) {
        startWaitingForFish();
      } else {
        castFill.style.width = castProgress + "%";
      }
    } else if (state === "TARIK") {
      if (holding) barPos = Math.min(172, barPos + 5.5);
      else barPos = Math.max(0, barPos - 4.0);

      if (Math.random() < 0.08) fishVel = (Math.random() - 0.48) * 7.0;
      fishPos += fishVel;
      if (fishPos < 10) { fishPos = 10; fishVel = Math.abs(fishVel); }
      if (fishPos > 205) { fishPos = 205; fishVel = -Math.abs(fishVel); }

      catchZone.style.bottom = barPos + "px";
      fishIcon.style.bottom = fishPos + "px";

      const barCenter = barPos + 32;
      const fishCenter = fishPos + 9;
      if (Math.abs(barCenter - fishCenter) < 38) {
        catchZone.style.background = "#8CE063";
        reelProgress = Math.min(100, reelProgress + 1.5);
      } else {
        catchZone.style.background = "#D4DC4E";
        reelProgress = Math.max(0, reelProgress - 0.7);
      }
      progFill.style.height = reelProgress + "%";

      if (reelProgress >= 100) {
        reelWrap.style.display = "none";
        progWrap.style.display = "none";
        state = "POPUP";
        popup.style.display = "flex";
      }
    }
  }, 40);
</script>
</body>
</html>
